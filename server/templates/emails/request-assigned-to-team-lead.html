<div>
  <h2 style="color: #1e3a8a; margin-bottom: 20px">Promoted to Team Lead 👥</h2>
  <p>Hello <strong>{{fullName}}</strong>,</p>
  <p>
    You have been assigned as the team lead for <strong>{{teamName}}</strong> by
    <strong>{{assignerName}}</strong>.
  </p>

  <div
    style="
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    "
  >
    <p><strong>Team:</strong> {{teamName}}</p>
    <p><strong>Directorate:</strong> {{directorate}}</p>
    <p><strong>Team Members:</strong> {{memberCount}}</p>
  </div>

  <div style="text-align: center; margin: 30px 0">
    <a href="{{teamUrl}}" class="button">Manage Team</a>
  </div>

  <p>
    Your responsibilities now include managing team tasks and submitting
    reports.
  </p>
</div>
