<div>
  <h2 style="color: #1e3a8a; margin-bottom: 20px">Added to Team 👥</h2>
  <p>Hello <strong>{{fullName}}</strong>,</p>
  <p>
    You have been added to the team <strong>{{teamName}}</strong> by
    <strong>{{assignerName}}</strong>.
  </p>

  <div
    style="
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
    "
  >
    <p><strong>Team:</strong> {{teamName}}</p>
    <p><strong>Directorate:</strong> {{directorate}}</p>
    <p><strong>Team Lead:</strong> {{teamLeadName}}</p>
  </div>

  <div style="text-align: center; margin: 30px 0">
    <a href="{{teamUrl}}" class="button">View Team</a>
  </div>
</div>
